<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Classic Canvas Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin-bottom: 40px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
            padding: 20px;
            text-align: center;
        }
        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .price {
            display: block;
            font-size: 1.2em;
            color: #333;
            margin: 10px 0;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        footer {
            background: #222;
            color: white;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <img src="Lounge-Space.jpg" alt="Lounge and Hall Space">
        <h3>Lounge & Hall Space</h3>
        <p>Beautiful low-light photography of corporate and residential halls.</p>
        <span class="price">$20.00</span>
        <a class="btn" href="https://wa.me/923330980303?text=Hi%20Moazzam,%20I%20am%20interested%20in%20ordering%20the%20Lounge%20Space%20Photography.">Order on WhatsApp</a>
    </div>

    <div class="card">
        <img src="Creative-Graphic-Bundle.png" alt="Creative Graphic Bundle">
        <h3>Creative Graphic Bundle</h3>
        <p>High-quality vector and illustrative design resources.</p>
        <span class="price">$25.00</span>
        <a class="btn" href="https://wa.me/923330980303?text=Hi%20Moazzam,%20I%20am%20interested%20in%20ordering%20the%20Creative%20Graphic%20Bundle.">Order on WhatsApp</a>
    </div>
</div>

<footer>
    <p>&copy; 2026 Classic Canvas Studio | Moazzam Masood Choudri</p>
</footer>

</html>
